AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Minimal AWS SAM playground for learning Lambda locally.

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/hello_world/
      Handler: app.lambda_handler
      Runtime: python3.13
      Events:
        HelloWorldApi:
          Type: Api
          Properties:
            Path: /hello
            Method: get
